<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DSH</title>
<style>
  :root{color-scheme:dark;--bg:#0b0c0e;--card:#14171c;--line:#23272e;--text:#e8ebf0;--muted:#8b93a1;--dim:#5a616b;--accent:#4d6bfe;--ok:#4fb477;--warn:#e0a94a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* A class that sets `display` outranks the UA rule for [hidden], which left the
     full-screen lightbox (and the composer, banner and jump button) permanently
     visible — the phone showed a black overlay over everything. */
  [hidden]{display:none !important}
  html{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;height:100%;width:100%;max-width:100%}
  body{background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,"PingFang SC",system-ui,sans-serif;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column;
       overflow:hidden;overflow-x:hidden}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex:none;
         position:sticky;top:0;background:rgba(11,12,14,.92);backdrop-filter:blur(12px);z-index:2}
  header h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;
       padding:7px 11px;font-size:13px;font-family:inherit}
  .btn:active{background:#1c2027}
  .conn{font-size:10.5px;color:#8a7a55;white-space:nowrap}
  .run{width:7px;height:7px;border-radius:99px;background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  main{flex:1;min-width:0;width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:6px 0}
  .row{display:flex;gap:10px;padding:13px 14px;border-bottom:1px solid #16191e;align-items:flex-start}
  .row:active{background:#12151a}
  .dot{width:7px;height:7px;border-radius:99px;background:#3a4048;margin-top:7px;flex:none}
  .dot.live{background:var(--accent);box-shadow:0 0 0 3px rgba(77,107,254,.16)}
  .t{font-size:14.5px;line-height:1.35;word-break:break-word;overflow-wrap:anywhere}
  .m{font-size:11.5px;color:var(--dim);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .msg{padding:10px 14px}
  .msg .who{font-size:10.5px;color:var(--dim);letter-spacing:.4px;margin-bottom:3px}
  .msg .body{word-break:break-word;overflow-wrap:anywhere;font-size:14px;max-width:100%}
  .msg .body p{margin:0 0 8px}
  .msg .body p:last-child{margin-bottom:0}
  .msg .body .h{font-weight:600;margin:10px 0 6px;color:#dfe3ea}
  .msg .body ul,.msg .body ol{margin:6px 0;padding-left:20px}
  .msg .body li{margin:2px 0}
  .msg .body code{background:#191d23;border:1px solid #262b33;border-radius:5px;padding:1px 5px;
                  font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .msg .body pre{background:#0e1116;border:1px solid #22262d;border-radius:10px;padding:10px 12px;
                 margin:8px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .msg .body pre code{background:none;border:0;padding:0;font-size:12.5px;line-height:1.5;white-space:pre}
  .msg .body strong{color:#fff;font-weight:600}
  .msg .body a{color:#7f9bff;text-decoration:none;border-bottom:1px solid rgba(127,155,255,.35)}
  .msg .body blockquote{margin:8px 0;padding:7px 12px;border-left:3px solid #2f3641;color:#aab2bf;
                        background:#12151a;border-radius:0 8px 8px 0}
  .msg .body blockquote p{margin:0}
  .msg .body table{border-collapse:collapse;margin:8px 0;font-size:12.5px;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .msg .body th,.msg .body td{border:1px solid #262b33;padding:6px 9px;text-align:left;white-space:nowrap;vertical-align:top}
  .msg .body th{background:#161a20;color:#cfd4de;font-weight:600}
  .lightbox{position:fixed;inset:0;background:#050608;z-index:60;display:flex;align-items:flex-start;
            justify-content:center;overflow:auto;padding:24px 12px 60px;touch-action:pinch-zoom;-webkit-overflow-scrolling:touch}
  .lightbox svg{width:220%;max-width:none;height:auto;flex:none}
  .lightbox .close{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:61;
                   width:36px;height:36px;border-radius:99px;border:1px solid #2b3038;background:rgba(20,23,28,.9);
                   color:#cfd4de;font-size:18px;line-height:1}
  .msg .body.clamp{position:relative;max-height:420px;overflow:hidden}
  .msg .body.clamp:after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;
                         background:linear-gradient(rgba(11,12,14,0),var(--bg))}
  .diagram{margin:8px 0;border:1px solid #22262d;border-radius:10px;background:#0e1116;padding:10px;overflow-x:auto}
  .diagram svg{max-width:100%;height:auto;display:block;margin:0 auto}
  .diagram .loading{color:#5a616b;font-size:12px;text-align:center;padding:10px}
  .diagram.failed{padding:0;border:0;background:none}
  .diagram.failed pre{background:#0e1116;border:1px solid #22262d;border-radius:10px;padding:10px 12px;
                      overflow-x:auto;font-size:12.5px;line-height:1.5;white-space:pre}
  .more{display:block;margin:2px 14px 10px;border:1px solid var(--line);background:var(--card);
        color:#9aa2ae;border-radius:9px;padding:7px;font-size:12.5px;font-family:inherit;width:calc(100% - 28px)}
  .jump{position:fixed;right:14px;bottom:calc(96px + env(safe-area-inset-bottom));width:38px;height:38px;border-radius:99px;
        border:1px solid var(--line);background:rgba(20,23,28,.94);color:#cfd4de;font-size:16px;
        display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:3}
  .ws .add{margin-left:4px;width:24px;height:24px;border-radius:8px;border:1px solid #2b3038;background:#15181d;
           color:#9aa2ae;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
  .composer .attach{width:40px;height:46px;border-radius:12px;border:1px solid #2a2f37;background:var(--card);
          color:#9aa2ae;font-size:20px;font-family:inherit;flex:none}
  .chip{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#12151a;
        border-top:1px solid var(--line);font-size:12px;color:#9aa2ae}
  .chip img{width:36px;height:36px;object-fit:cover;border-radius:8px}
  .chip .x{margin-left:auto;background:none;border:0;color:#8b93a1;font-size:18px;font-family:inherit}
  .stop{border:1px solid #4a2323;background:#2a1616;color:#e88c8c;border-radius:12px;height:46px;padding:0 12px;
        font-size:13px;font-family:inherit;font-weight:600}
  .msg.user .body{color:#cdd7ff}
  .msg.tool{color:var(--dim);font-size:12px;font-family:ui-monospace,Menlo,monospace;padding-top:2px;padding-bottom:2px}
  .group.collapsed .sessions{display:none}
  .group.collapsed .chev{transform:rotate(-90deg)}
  .ws{display:flex;align-items:center;gap:8px;padding:13px 14px 7px;position:sticky;top:0;
      background:rgba(11,12,14,.95);backdrop-filter:blur(8px);z-index:1}
  .ws .chev{color:#5a616b;font-size:11px;transition:transform .15s}
  .ws .name{font-size:12px;font-weight:600;color:#b9c0cc;letter-spacing:.3px}
  .ws .n{font-size:10.5px;color:#5a616b;border:1px solid #23272e;border-radius:99px;padding:1px 6px}
  .ws .p{margin-left:auto;min-width:0;font-size:10.5px;color:#4e5560;max-width:46%;overflow:hidden;
         text-overflow:ellipsis;white-space:nowrap}
  .row.under{padding-left:34px}
  .older-toggle{padding:12px 14px 12px 34px;font-size:12px;color:#6c7480;display:flex;align-items:center;gap:6px}
  .older-toggle:active{color:#9aa2ae}
  .older.hidden{display:none}
  .none{color:#3f454d;font-size:12px;padding:2px 14px 10px 34px}
  .waiting{flex:none;display:flex;gap:8px;align-items:center;padding:10px 14px;font-size:12.5px;
            background:#1d1a12;border-top:1px solid #3a3320;color:#e8c98c}
  .waiting b{font-weight:600;white-space:nowrap}
  .waiting code{background:#0d0f12;border:1px solid #2a2418;border-radius:6px;padding:1px 6px;font-size:11.5px;white-space:nowrap;flex:none;
                max-width:30vw;overflow:hidden;text-overflow:ellipsis}
  .waiting span{margin-left:auto;color:#8a7a55;font-size:11px;white-space:nowrap;
                min-width:0;overflow:hidden;text-overflow:ellipsis}
  .waiting .ap{border:1px solid #4a3d1f;background:#2a2418;color:#e8c98c;border-radius:9px;
               padding:6px 12px;font-size:12.5px;font-family:inherit;flex:none;white-space:nowrap}
  .waiting .ap.allow{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .waiting .ap:disabled{opacity:.4}
  .composer{flex:none;width:100%;display:flex;gap:8px;align-items:flex-end;padding:8px 12px calc(10px + env(safe-area-inset-bottom));
            border-top:1px solid var(--line);background:var(--bg)}
  /* iOS Safari auto-zooms the whole page when a focused field's font-size is
     below 16px and never zooms back out. Keep this at 16px — and use longhands:
     `font: 16px/1.4 inherit` is invalid CSS (inherit cannot be a shorthand
     component), which silently left the field at the 13.3px UA default. */
  .composer textarea{flex:1;min-width:0;background:var(--card);border:1px solid #2a2f37;border-radius:12px;color:var(--text);
                     font-size:16px;font-family:inherit;line-height:1.4;
                     padding:11px 12px;resize:none;height:46px;max-height:120px;outline:none}
  .composer textarea:focus{border-color:var(--accent)}
  .composer button{width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;border:0;
                   font-size:14px;font-weight:600;font-family:inherit}
  .composer button[disabled]{opacity:.35}
  .empty{color:var(--dim);text-align:center;padding:48px 24px;font-size:13px}
  .err{color:#e2706b;text-align:center;padding:24px;font-size:13px}
  footer{flex:none;padding:8px 14px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;display:flex;justify-content:space-between}
  .skel{height:52px;margin:0 14px;border-bottom:1px solid #16191e;opacity:.35;
        background:linear-gradient(90deg,#14171c 0%,#1b1f26 50%,#14171c 100%);background-size:200% 100%;
        animation:sh 1.2s infinite linear}
  @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
</style>
</head>
<body>
<header>
  <button class="btn" id="back" hidden style="white-space:nowrap">‹ 工作区</button>
  <h1 id="title">DSH</h1>
  <span class="conn" id="conn" hidden>重连中…</span>
  <span class="run" id="run" hidden title="运行中"></span>
  <button class="btn" id="refresh">刷新</button>
</header>
<main id="main"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<div class="waiting" id="waiting" hidden></div>
<button class="jump" id="jump" hidden>↓</button>
<div class="lightbox" id="lightbox" hidden><button class="close" id="lightbox-close">×</button></div>
<div class="chip" id="chip" hidden></div>
<div class="composer" id="composer" hidden>
  <button class="attach" id="attach">＋</button>
  <input type="file" id="file" accept="image/*" hidden>
  <textarea id="input" rows="1" placeholder="回一句…" enterkeyhint="enter"></textarea>
  <button class="stop" id="stop" hidden>停止</button>
  <button id="send">发送</button>
</div>
<footer><span id="hint">只读</span><span id="stat"></span></footer>

<script>
const BUILD = 'v36'
// Anything that kills the script before the first render used to leave the phone
// on a black screen with no clue. Surface it instead.
function showFatal (message) {
  const box = document.getElementById('main')
  if (!box) return
  box.innerHTML = ''
  const div = document.createElement('div')
  div.className = 'err'
  div.textContent = '页面脚本出错：' + message + '（构建 ' + BUILD + '）'
  box.appendChild(div)
}
window.addEventListener('error', (event) => showFatal(event.message + ' @' + event.lineno))
window.addEventListener('unhandledrejection', (event) => {
  const reason = event.reason
  showFatal(reason && reason.message ? reason.message : String(reason))
})

const $ = (id) => document.getElementById(id)
const main = $('main'), title = $('title'), back = $('back'), hint = $('hint'), stat = $('stat')
const composer = $('composer'), input = $('input'), sendBtn = $('send'), waiting = $('waiting'), run = $('run')
const jump = $('jump'), stop = $('stop'), chip = $('chip'), attach = $('attach'), fileInput = $('file'), conn = $('conn')
const lightbox = $('lightbox')
let pendingImages = []
let running = false
let view = { name: 'list', id: null }

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const ago = (ms) => {
  const d = Math.max(0, Date.now() - ms) / 1000
  if (d < 60) return '刚刚'
  if (d < 3600) return Math.floor(d / 60) + ' 分钟前'
  if (d < 86400) return Math.floor(d / 3600) + ' 小时前'
  return Math.floor(d / 86400) + ' 天前'
}
const base = (p) => (p || '').split('/').filter(Boolean).pop() || p || ''

async function getJSON (url) {
  const r = await fetch(url, { headers: { accept: 'application/json' } })
  if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 120))
  return r.json()
}

const ACTIVE_WINDOW_MS = 24 * 60 * 60 * 1000

function sessionRow (s) {
  return `<div class="row under" data-id="${esc(s.id)}">
      <div class="dot ${s.running ? 'live' : ''}"></div>
      <div style="flex:1;min-width:0"><div class="t">${esc(s.title || '(未命名)')}</div>
        <div class="m"><span>${ago(s.updatedAt ?? s.createdAt)}</span>${s.running ? '<span>运行中</span>' : ''}</div>
      </div></div>`
}

function closeLightbox () {
  lightbox.hidden = true
  lightbox.innerHTML = '<button class="close" id="lightbox-close">×</button>'
}

function renderTree (data) {
  closeLightbox()
  const groups = data.workspaces || []
  const total = groups.reduce((sum, g) => sum + g.sessions.length, 0)
  title.textContent = '工作区 · ' + groups.length
  hint.textContent = total + ' 个会话'
  back.hidden = true
  composer.hidden = true
  waiting.hidden = true
  jump.hidden = true
  if (!groups.length) { main.innerHTML = '<div class="empty">还没有工作区</div>'; return }

  let expanded = {}
  try { expanded = JSON.parse(localStorage.getItem('m.older') || '{}') } catch {}
  const now = Date.now()

  main.innerHTML = groups.map((g) => {
    const active = []
    const older = []
    for (const s of g.sessions) {
      if (s.running === true || now - (s.updatedAt ?? 0) < ACTIVE_WINDOW_MS) active.push(s)
      else older.push(s)
    }
    const open = expanded[g.id] === true
    return `<div class="group" data-g="${esc(g.id)}">
      <div class="ws"><span class="chev">▾</span><span class="name">${esc(g.title)}</span>
        <span class="n">${g.sessions.length}</span>
        ${g.path ? `<button class="add" data-path="${esc(g.path)}" title="新建会话">＋</button>` : ''}
        <span class="p">${esc(g.path || '')}</span></div>
      <div class="sessions">
        ${active.map(sessionRow).join('')}
        ${older.length === 0 ? '' : `
          <div class="older-toggle" data-g="${esc(g.id)}">${open ? '▾ 收起更早' : '▸ 更早 · ' + older.length + ' 个'}</div>
          <div class="older ${open ? '' : 'hidden'}" data-g="${esc(g.id)}">${older.map(sessionRow).join('')}</div>`}
      </div>
    </div>`
  }).join('')

  let collapsed = {}
  try { collapsed = JSON.parse(localStorage.getItem('m.collapsed') || '{}') } catch {}
  for (const group of main.querySelectorAll('.group')) {
    const key = group.dataset.g
    if (collapsed[key]) group.classList.add('collapsed')
    group.querySelector('.ws').onclick = () => {
      group.classList.toggle('collapsed')
      collapsed[key] = group.classList.contains('collapsed')
      try { localStorage.setItem('m.collapsed', JSON.stringify(collapsed)) } catch {}
    }
    const add = group.querySelector('.add')
    if (add) {
      add.onclick = async (ev) => {
        ev.stopPropagation()
        add.disabled = true
        try {
          const res = await fetch('/m/api/create', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ cwd: add.dataset.path }),
          })
          if (!res.ok) throw new Error((await res.text()).slice(0, 140))
          const created = await res.json()
          if (created && created.sessionId) open(created.sessionId)
        } catch (e) {
          main.insertAdjacentHTML('beforeend', '<div class="err">新建失败：' + esc(e.message) + '</div>')
        } finally {
          add.disabled = false
        }
      }
    }
    for (const row of group.querySelectorAll('.row')) row.onclick = () => open(row.dataset.id)
    const toggle = group.querySelector('.older-toggle')
    if (toggle) {
      toggle.onclick = () => {
        const key = toggle.dataset.g
        const list = group.querySelector('.older')
        const nowOpen = list.classList.contains('hidden')
        expanded[key] = nowOpen
        try { localStorage.setItem('m.older', JSON.stringify(expanded)) } catch {}
        list.classList.toggle('hidden', !nowOpen)
        toggle.textContent = nowOpen ? '▾ 收起更早' : '▸ 更早 · ' + list.children.length + ' 个'
      }
    }
  }
}

function renderApproval (pending) {
  if (!pending) { waiting.hidden = true; waiting.innerHTML = ''; return }
  waiting.hidden = false
  waiting.innerHTML = `<b>等待批准</b><code>${esc(pending.toolName)}</code>` +
    (pending.reason ? `<span style="margin-left:0;color:#8a7a55">${esc(String(pending.reason).slice(0, 40))}</span>` : '') +
    `<button class="ap" data-d="deny">拒绝</button><button class="ap allow" data-d="allow">允许一次</button>`
  for (const btn of waiting.querySelectorAll('.ap')) {
    btn.onclick = async () => {
      for (const b of waiting.querySelectorAll('.ap')) b.disabled = true
      try {
        const res = await fetch('/m/api/approve', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ id: pending.id, decision: btn.dataset.d }),
        })
        if (!res.ok) throw new Error((await res.text()).slice(0, 120))
        waiting.hidden = true
      } catch (e) {
        main.innerHTML = '<div class="err">审批失败：' + esc(e.message) + '</div>'
      }
    }
  }
}

const escapeHTML = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function mdInline (raw) {
  let t = escapeHTML(raw)
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>')
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
  t = t.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (match, label, href) => {
    const safe = /^(https?:\/\/|\/|#|mailto:)/i.test(href) ? href : '#'
    return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${label}</a>`
  })
  const lines = t.split('\n')
  const out = []
  let list = null
  let para = []
  let quoteLines = []
  const flushPara = () => { if (para.length) { out.push(`<p>${para.join('<br>')}</p>`); para = [] } }
  const closeList = () => { if (list) { out.push(list === 'ul' ? '</ul>' : '</ol>'); list = null } }
  const flushQuote = () => {
    const text = quoteLines.map((line) => line.trim()).filter((line) => line !== '').join('<br>')
    quoteLines = []
    if (text !== '') out.push(`<blockquote><p>${text}</p></blockquote>`)
  }
  const splitCells = (line) => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((cell) => cell.trim())

  for (let i = 0; i < lines.length; i += 1) {
    const line = lines[i]

    // GFM table: a header row followed by a |---|---| separator.
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      flushPara(); closeList(); flushQuote()
      const head = splitCells(line)
      let html = '<table><thead><tr>' + head.map((cell) => `<th>${cell}</th>`).join('') + '</tr></thead><tbody>'
      i += 2
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        html += '<tr>' + splitCells(lines[i]).map((cell) => `<td>${cell}</td>`).join('') + '</tr>'
        i += 1
      }
      i -= 1
      out.push(html + '</tbody></table>')
      continue
    }

    // Inline escaping already turned the marker into &gt;.
    const quote = /^\s*(?:>|&gt;)\s?(.*)$/.exec(line)
    if (quote) {
      flushPara(); closeList()
      quoteLines.push(quote[1])
      continue
    }
    if (quoteLines.length > 0) flushQuote()

    const h = /^(#{1,3})\s+(.*)$/.exec(line)
    if (h) { flushPara(); closeList(); out.push(`<div class="h">${h[2]}</div>`); continue }
    const ul = /^\s*[-*+]\s+(.*)$/.exec(line)
    if (ul) { flushPara(); if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul' } out.push(`<li>${ul[1]}</li>`); continue }
    const ol = /^\s*\d+[.)]\s+(.*)$/.exec(line)
    if (ol) { flushPara(); if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol' } out.push(`<li>${ol[1]}</li>`); continue }
    if (line.trim() === '') { flushPara(); closeList(); continue }
    closeList()
    para.push(line)
  }
  flushPara()
  closeList()
  return out.join('')
}

function renderMarkdown (src) {
  const text = String(src ?? '')
  const re = /```([^\n`]*)\n([\s\S]*?)```/g
  let out = ''
  let last = 0
  let m
  while ((m = re.exec(text)) !== null) {
    out += mdInline(text.slice(last, m.index))
    const lang = String(m[1] ?? '').trim().toLowerCase()
    const body = m[2].replace(/\n$/, '')
    if (lang === 'mermaid' || lang === 'mmd') {
      out += `<div class="diagram" data-src="${escapeHTML(body)}"><div class="loading">图表加载中…</div></div>`
    } else {
      out += `<pre><code>${escapeHTML(body)}</code></pre>`
    }
    last = m.index + m[0].length
  }
  out += mdInline(text.slice(last))
  return out
}

function messageHTML (role, text) {
  if (role === 'tool') return `<div class="msg tool">↳ ${esc(text)}</div>`
  return `<div class="msg ${role}"><div class="who">${role === 'user' ? '你' : 'DSH'}</div><div class="body">${renderMarkdown(text)}</div></div>`
}

function renderSession (data) {
  closeLightbox()
  liveEl = null
  title.textContent = data.title || '会话'
  hint.textContent = base(data.cwd) || ''
  back.hidden = false
  composer.hidden = false
  renderApproval((data.approvals || [])[0] || null)
  if (!data.messages.length) { main.innerHTML = '<div class="empty">这个会话还没有消息</div>'; return }
  main.innerHTML = data.messages.map((m) => messageHTML(m.role, m.text)).join('')
  main.scrollTop = main.scrollHeight
  afterRender()
}

let mermaidLoader = null
function loadMermaid () {
  if (mermaidLoader) return mermaidLoader
  mermaidLoader = new Promise((resolve, reject) => {
    const script = document.createElement('script')
    script.src = '/m/assets/mermaid.js'
    script.async = true
    script.onload = () => {
      try {
        window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'dark' })
        resolve(window.mermaid)
      } catch (e) { reject(e) }
    }
    script.onerror = () => reject(new Error('mermaid load failed'))
    document.head.appendChild(script)
  })
  return mermaidLoader
}

async function hydrateDiagrams () {
  const blocks = [...main.querySelectorAll('.diagram:not([data-state])')]
  if (blocks.length === 0) return
  let mermaid
  try {
    mermaid = await loadMermaid()
  } catch {
    for (const block of blocks) { block.dataset.state = 'failed'; block.classList.add('failed'); block.innerHTML = '<pre></pre>'; block.firstChild.textContent = block.dataset.src }
    return
  }
  for (const [index, block] of blocks.entries()) {
    block.dataset.state = 'done'
    try {
      const { svg } = await mermaid.render('mmd' + index + '-' + (block.dataset.src || '').length, block.dataset.src)
      block.innerHTML = svg
    } catch {
      block.classList.add('failed')
      block.innerHTML = '<pre></pre>'
      block.firstChild.textContent = block.dataset.src
    }
  }
}

function afterRender () {
  for (const body of main.querySelectorAll('.msg .body')) {
    if (body.dataset.folded !== undefined) continue
    body.dataset.folded = '1'
    if (body.scrollHeight > 460) {
      body.classList.add('clamp')
      const btn = document.createElement('button')
      btn.className = 'more'
      btn.textContent = '展开全文'
      btn.onclick = () => { body.classList.remove('clamp'); btn.remove() }
      body.after(btn)
    }
  }
  requestAnimationFrame(() => { jump.hidden = nearBottom() })
  hydrateDiagrams()
}

// ---------- live stream (SSE) ----------
let es = null
let pollTimer = null
let retryTimer = null
let retryDelay = 2000

function closeStream () {
  conn.hidden = true
  if (es) { es.close(); es = null }
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null }
}

function setRunning (value) {
  running = value === true
  run.hidden = !running
  stop.hidden = !running || view.name !== 'session'
}

function nearBottom () {
  return main.scrollHeight - main.scrollTop - main.clientHeight < 120
}

let liveEl = null

function ensureLive () {
  if (liveEl) return liveEl
  const atBottom = nearBottom()
  if (main.querySelector('.empty')) main.innerHTML = ''
  main.insertAdjacentHTML('beforeend', '<div class="msg assistant"><div class="who">DSH</div><div class="body"></div></div>')
  liveEl = main.lastElementChild
  if (atBottom) main.scrollTop = main.scrollHeight
  return liveEl
}

main.addEventListener('click', (ev) => {
  const block = ev.target.closest && ev.target.closest('.diagram')
  if (!block) return
  const svg = block.querySelector('svg')
  if (!svg) return
  lightbox.innerHTML = '<button class="close" id="lightbox-close">×</button>'
  lightbox.appendChild(svg.cloneNode(true))
  lightbox.hidden = false
  lightbox.scrollTop = 0
})
let lightboxTouch = null
lightbox.addEventListener('pointerdown', (ev) => { lightboxTouch = { x: ev.clientX, y: ev.clientY } })
lightbox.addEventListener('pointerup', (ev) => {
  if (lightboxTouch === null) return
  const moved = Math.hypot(ev.clientX - lightboxTouch.x, ev.clientY - lightboxTouch.y)
  lightboxTouch = null
  // A drag is panning; a tap closes, even on top of the diagram.
  if (moved > 12) return
  lightbox.hidden = true
  lightbox.innerHTML = ''
})

main.addEventListener('scroll', () => { jump.hidden = nearBottom() })
jump.onclick = () => { main.scrollTop = main.scrollHeight }

function appendDelta (text) {
  const el = ensureLive()
  el.querySelector('.body').textContent += text
  if (nearBottom()) main.scrollTop = main.scrollHeight
  run.hidden = false
}

function appendMessage (role, text) {
  if (role === 'assistant' && liveEl) {
    // The durable message replaces the streamed bubble instead of duplicating it.
    liveEl.querySelector('.body').textContent = text
    liveEl = null
    return
  }
  const atBottom = nearBottom()
  if (main.querySelector('.empty')) main.innerHTML = ''
  main.insertAdjacentHTML('beforeend', messageHTML(role, text))
  if (atBottom) main.scrollTop = main.scrollHeight
  afterRender()
}

function scheduleReconnect (id) {
  if (retryTimer) return
  const delay = retryDelay
  retryDelay = Math.min(retryDelay * 2, 30000)
  retryTimer = setTimeout(() => {
    retryTimer = null
    if (view.name === 'session' && view.id === id) connectStream(id)
  }, delay)
}

function connectStream (id) {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null }
  closeStream()
  if (typeof EventSource === 'undefined') return startPolling()
  es = new EventSource('/m/api/events?session=' + encodeURIComponent(id))
  es.onopen = () => { conn.hidden = true; retryDelay = 2000; refreshOnce() }
  es.onmessage = (ev) => {
    let msg
    try { msg = JSON.parse(ev.data) } catch { return }
    if (msg.kind === 'state') { setRunning(msg.running); if (!msg.running) refreshOnce(); return }
    if (msg.kind === 'astart') { setRunning(true); liveEl = null; ensureLive(); return }
    if (msg.kind === 'adelta') { appendDelta(msg.text); return }
    if (msg.kind === 'aend') { if (liveEl) liveEl = null; return }
    if (msg.kind === 'message') { appendMessage(msg.role, msg.text); return }
    if (msg.kind === 'tool') { run.hidden = false; appendMessage('tool', '工具调用'); return }
    if (msg.kind === 'approval') { renderApproval(msg); return }
    if (msg.kind === 'approval-done') { refreshOnce(); return }
  }
  es.onerror = () => {
    setRunning(false)
    conn.hidden = false
    closeStream()
    startPolling()
    scheduleReconnect(id)
  }
}

async function refreshOnce () {
  if (view.name !== 'session') return
  try {
    const data = await getJSON('/m/api/session?id=' + encodeURIComponent(view.id))
    renderSession(data)
  } catch {}
}

function startPolling () {
  if (pollTimer) return
  pollTimer = setInterval(() => { if (!document.hidden) refreshOnce() }, 6000)
}

async function loadList (resetScroll = true) {
  liveEl = null
  closeStream()
  run.hidden = true
  view = { name: 'list', id: null }
  history.replaceState(null, '', '#')
  try {
    const t0 = performance.now()
    const data = await getJSON('/m/api/sessions')
    renderTree(data)
    // Coming back from a session must land on the newest work, which sits at the
    // top; the periodic refresh keeps whatever the reader is looking at.
    if (resetScroll) main.scrollTop = 0
    stat.textContent = Math.round(performance.now() - t0) + 'ms · ' + BUILD
  } catch (e) {
    main.innerHTML = '<div class="err">加载失败：' + esc(e.message) + '</div>'
  }
}

async function open (id) {
  view = { name: 'session', id }
  history.replaceState(null, '', '#' + id)
  main.innerHTML = '<div class="skel"></div><div class="skel"></div>'
  try {
    const t0 = performance.now()
    const data = await getJSON('/m/api/session?id=' + encodeURIComponent(id))
    renderSession(data)
    connectStream(view.id)
    stat.textContent = Math.round(performance.now() - t0) + 'ms'
  } catch (e) {
    main.innerHTML = '<div class="err">加载失败：' + esc(e.message) + '</div>'
  }
}

async function sendMessage () {
  const text = input.value.trim()
  if (!text || sendBtn.disabled) return
  sendBtn.disabled = true
  sendBtn.textContent = '…'
  try {
    const res = await fetch('/m/api/prompt', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        id: view.id,
        text,
        images: pendingImages.map((img) => ({ mediaType: img.mediaType, data: img.data, name: img.name })),
      }),
    })
    if (!res.ok) throw new Error((await res.text()).slice(0, 160))
    input.value = ''
    pendingImages = []
    renderChip()
    input.style.height = '44px'
    setTimeout(() => open(view.id), 700)
  } catch (e) {
    main.innerHTML = '<div class="err">发送失败：' + esc(e.message) + '</div>'
  } finally {
    sendBtn.disabled = false
    sendBtn.textContent = '发送'
  }
}

sendBtn.onclick = sendMessage
input.addEventListener('keydown', (e) => {
  // Enter is a newline now (the phone's keyboard action key is "return").
  // Cmd/Ctrl+Enter stays as a fast send for keyboards that have one.
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendMessage() }
})
attach.onclick = () => fileInput.click()
fileInput.onchange = () => {
  const file = fileInput.files && fileInput.files[0]
  fileInput.value = ''
  if (!file) return
  if (file.size > 4 * 1024 * 1024) { main.insertAdjacentHTML('beforeend', '<div class="err">图片不要超过 4MB</div>'); return }
  const reader = new FileReader()
  reader.onload = () => {
    const url = String(reader.result || '')
    const comma = url.indexOf(',')
    if (comma < 0) return
    pendingImages.push({ mediaType: file.type || 'image/png', data: url.slice(comma + 1), name: file.name, url })
    renderChip()
  }
  reader.readAsDataURL(file)
}

function renderChip () {
  chip.hidden = pendingImages.length === 0
  chip.innerHTML = pendingImages.map((img, i) =>
    `<img src="${img.url}" alt=""><span>${esc(img.name || 'image').slice(0, 20)}</span>
     <button class="x" data-i="${i}">×</button>`).join('')
  for (const btn of chip.querySelectorAll('.x')) {
    btn.onclick = () => { pendingImages.splice(Number(btn.dataset.i), 1); renderChip() }
  }
}

stop.onclick = async () => {
  if (view.name !== 'session' || stop.disabled) return
  stop.disabled = true
  try {
    await fetch('/m/api/cancel', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: view.id }),
    })
  } catch (e) {
    main.insertAdjacentHTML('beforeend', '<div class="err">中断失败：' + esc(e.message) + '</div>')
  } finally {
    stop.disabled = false
  }
}

input.addEventListener('input', () => {
  input.style.height = '44px'
  input.style.height = Math.min(120, input.scrollHeight) + 'px'
})

$('refresh').onclick = () => (view.name === 'session' ? open(view.id) : loadList())
back.onclick = () => loadList()
window.addEventListener('popstate', () => (location.hash ? open(location.hash.slice(1)) : loadList()))

if (location.hash.length > 1) open(location.hash.slice(1))
else loadList()
setInterval(() => { if (view.name === 'list' && !document.hidden) loadList(false) }, 15000)


</script>
